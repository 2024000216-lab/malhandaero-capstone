<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>말한대로 · 크게 보기 — 홈</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <a class="back-to-index" href="../index.html">← 전체 화면</a>
    <div
      class="screen"
      style="
        min-height: 844px;
        box-sizing: border-box;
        background: #ffffff;
        color: #1a1a1a;
        padding: 28px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      "
    >
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
        "
      >
        <div style="font-size: 30px; font-weight: 800">10월 19일 월요일</div>
      </div>

      <div
        style="
          border: 3px solid #1a1a1a;
          border-radius: 24px;
          padding: 22px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <span style="font-size: 20px; font-weight: 700; color: #4a4a4a"
            >다음 일정</span
          >
          <span
            style="
              font-size: 18px;
              font-weight: 800;
              color: #ffffff;
              background: #1a1a1a;
              border-radius: 999px;
              padding: 4px 12px;
            "
            >2시간 뒤</span
          >
        </div>
        <div style="font-size: 56px; font-weight: 800; line-height: 1.15">
          오후 3시
        </div>
        <div style="font-size: 36px; font-weight: 800">팀 회의</div>
        <div style="font-size: 24px; color: #4a4a4a">도서관</div>
        <button
          style="
            margin-top: 12px;
            height: 56px;
            border: 2px solid #1a1a1a;
            border-radius: 14px;
            background: #ffffff;
            font: inherit;
            font-size: 20px;
            font-weight: 800;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
          "
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M11 5L6 9H3v6h3l5 4z"></path>
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
          소리로 읽어주기
        </button>
      </div>

      <div style="flex: 1"></div>

      <button
        style="
          height: 112px;
          border: 0;
          border-radius: 24px;
          background: #2b4acb;
          color: #ffffff;
          font: inherit;
          font-size: 28px;
          font-weight: 800;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
        "
      >
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
        말로 일정 등록
      </button>
      <a
        href="05-schedule-colorblind.html"
        style="
          height: 76px;
          box-sizing: border-box;
          border: 3px solid #1a1a1a;
          border-radius: 20px;
          text-decoration: none;
          color: #1a1a1a;
          font-size: 24px;
          font-weight: 800;
          display: flex;
          align-items: center;
          justify-content: center;
        "
        >오늘 일정 모두 보기 (2개)</a
      >
      <button
        style="
          background: none;
          border: 0;
          font: inherit;
          font-size: 19px;
          color: #4a4a4a;
          text-decoration: underline;
          min-height: 48px;
        "
      >
        보통 화면으로
      </button>
    </div>
  </body>
</html>
