<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>말한대로 · 일정 관리 — 색약 모드</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap"
    />
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <a class="back-to-index" href="../index.html">← 전체 화면</a>
    <div
      class="screen"
      style="
        min-height: 980px;
        box-sizing: border-box;
        background: #ffffff;
        color: #111111;
        display: flex;
        flex-direction: column;
      "
    >
      <div
        style="
          height: 60px;
          box-sizing: border-box;
          padding: 0 16px;
          border-bottom: 2px solid #111111;
          display: grid;
          grid-template-columns: 80px 1fr 80px;
          align-items: center;
        "
      >
        <a
          href="03-menu.html"
          style="
            text-decoration: none;
            color: #111111;
            font-size: 18px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 2px;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            aria-hidden="true"
          >
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
          뒤로
        </a>
        <div style="font-size: 20px; font-weight: 800; text-align: center">
          일정 관리
        </div>
        <div></div>
      </div>
      <div
        style="
          flex: 1;
          padding: 18px 20px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        "
      >
        <div
          style="
            background: #111111;
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 20px;
            font-weight: 800;
          "
        >
          오늘 · 10월 19일 월
        </div>
        <button
          style="
            width: 100%;
            box-sizing: border-box;
            border: 2.5px dashed #6b6b6b;
            border-radius: 16px;
            background: #ffffff;
            font: inherit;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            color: #555555;
          "
        >
          <span
            style="width: 100%; display: flex; align-items: center; gap: 12px"
          >
            <span
              style="flex: 1; display: flex; flex-direction: column; gap: 2px"
            >
              <span style="font-size: 18px; font-weight: 800">오후 3시</span>
              <span style="font-size: 24px; font-weight: 800">팀 회의</span>
            </span>
            <span
              style="
                flex: none;
                font-size: 16px;
                font-weight: 800;
                color: #444444;
                border: 2px solid #6b6b6b;
                border-radius: 8px;
                padding: 4px 10px;
              "
              >끝남</span
            >
          </span>
        </button>
        <button
          style="
            width: 100%;
            box-sizing: border-box;
            border: 4px solid #1f4fd1;
            border-radius: 16px;
            background: #ffffff;
            font: inherit;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            color: #111111;
          "
        >
          <span
            style="
              align-self: flex-start;
              font-size: 15px;
              font-weight: 800;
              color: #ffffff;
              background: #1f4fd1;
              border-radius: 8px;
              padding: 3px 10px;
              margin-bottom: 6px;
            "
            >▶ 다음 일정</span
          >
          <span
            style="width: 100%; display: flex; align-items: center; gap: 12px"
          >
            <span
              style="flex: 1; display: flex; flex-direction: column; gap: 2px"
            >
              <span style="font-size: 18px; font-weight: 800"
                >오후 7시 30분</span
              >
              <span style="font-size: 24px; font-weight: 800">저녁 약속</span>
            </span>
          </span>
        </button>
        <div
          style="
            border: 2px solid #111111;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 20px;
            font-weight: 800;
            margin-top: 6px;
          "
        >
          내일 · 10월 20일 화
        </div>
        <button
          style="
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #111111;
            border-radius: 16px;
            background: #ffffff;
            font: inherit;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            color: #111111;
          "
        >
          <span
            style="width: 100%; display: flex; align-items: center; gap: 12px"
          >
            <span
              style="flex: 1; display: flex; flex-direction: column; gap: 2px"
            >
              <span style="font-size: 18px; font-weight: 800">오전 10시</span>
              <span style="font-size: 24px; font-weight: 800">물리치료</span>
              <span style="font-size: 16px; font-weight: 700; color: #333333"
                >매주 화요일마다</span
              >
            </span>
          </span>
        </button>
        <button
          style="
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #111111;
            border-radius: 16px;
            background: #ffffff;
            font: inherit;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            color: #111111;
          "
        >
          <span
            style="width: 100%; display: flex; align-items: center; gap: 12px"
          >
            <span
              style="flex: 1; display: flex; flex-direction: column; gap: 2px"
            >
              <span style="font-size: 18px; font-weight: 800">오후 2시</span>
              <span style="font-size: 24px; font-weight: 800">치과</span>
            </span>
          </span>
        </button>
        <div
          style="
            border: 2px solid #111111;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 20px;
            font-weight: 800;
            margin-top: 6px;
          "
        >
          10월 23일 금
        </div>
        <button
          style="
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #111111;
            border-radius: 16px;
            background: #ffffff;
            font: inherit;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            text-align: left;
            color: #111111;
          "
        >
          <span
            style="width: 100%; display: flex; align-items: center; gap: 12px"
          >
            <span
              style="flex: 1; display: flex; flex-direction: column; gap: 2px"
            >
              <span style="font-size: 18px; font-weight: 800">오전 9시</span>
              <span style="font-size: 24px; font-weight: 800">정형외과</span>
            </span>
          </span>
        </button>
      </div>
      <div style="border-top: 2px solid #111111; padding: 14px 20px 22px">
        <button
          style="
            width: 100%;
            height: 64px;
            border: 0;
            border-radius: 16px;
            background: #1f4fd1;
            color: #ffffff;
            font: inherit;
            font-size: 21px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
          "
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v3"></path>
          </svg>
          눌러서 말하기
        </button>
      </div>
    </div>
  </body>
</html>
